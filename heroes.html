<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="六星英靈喜好圖鑑：依角色、稱號或物品查詢最愛與喜愛物品。">
<title>六星英靈喜好圖鑑</title>
<link rel="stylesheet" href="./styles.css?v=2.3.0">
</head>
<body class="heroes-standalone"><main class="app-shell">
<header class="hero-guide-header"><p class="eyebrow">SIX-STAR HEROES</p><h1>六星英靈喜好圖鑑</h1><p class="helper">找到英靈，選對禮物。收錄 23 位六星英靈的固定喜好。</p></header>
<section class="panel hero-preferences-panel" aria-labelledby="heroPreferenceTitle"><div class="panel-head"><div><p class="eyebrow">HERO GIFT GUIDE</p><h2 id="heroPreferenceTitle">六星英靈喜好</h2></div><span class="status-chip">官方資料 3.16.0</span></div><p class="helper">依英靈名稱、稱號或物品查找喜愛與最愛。同名的不同版本分開列出。</p><div class="hero-preference-filters"><label class="field"><span>搜尋英靈／稱號／物品</span><input id="heroSearch" type="search" placeholder="例如：伊茲、巧克力" autocomplete="off"></label><label class="field"><span>指定英靈</span><select id="heroSelect"><option value="">全部六星英靈</option></select></label><label class="field"><span>找出喜歡這個物品的英靈</span><select id="heroItemFilter"><option value="">全部物品</option></select></label><label class="field"><span>喜好範圍</span><select id="heroPreferenceFilter"><option value="">喜愛與最愛</option><option value="loved">只查最愛</option><option value="favorite">只查喜愛</option></select></label></div><div class="hero-filter-status"><p id="heroPreferenceCount" role="status" aria-live="polite"></p><button id="heroClearFilters" type="button" class="secondary-btn">清除篩選</button></div><section class="hero-common-gifts"><h3>所有六星皆喜愛的通用物品</h3><div id="heroCommonGifts"></div><p class="unit-note">以下英靈的喜愛項目皆包含這些物品；各卡片另外列出個別喜好。</p></section><div id="heroPreferenceResults" class="hero-preference-grid"></div><p class="unit-note">僅列出這份官方資料中的六星英靈；缺少所選語言翻譯時保留日文原名。喜好清單不會修改遠征掉落。</p></section>
</main>
<script src="./hero-preferences-data.js?v=2.3.0"></script>
<script src="./hero-preferences-view.js?v=2.3.1"></script>
</body>
</html>
