<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b1a">
  <meta name="robots" content="noindex">
  <title>正式挑戰暫停開放｜DFCH Treasure</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:22px;
      font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#f6eaff;
      background:radial-gradient(circle at 50% 0%,#382945 0%,#141426 65%,#0c0c1c 100%)}
    main{width:min(100%,520px);padding:32px 26px;border:1px solid #685780;border-radius:18px;
      background:linear-gradient(145deg,#2b2342,#191a30);text-align:center;box-shadow:0 20px 55px #05051065}
    .tag{font-size:11px;letter-spacing:.16em;color:#d9b780;font-weight:800}
    h1{font-size:clamp(22px,5vw,28px);margin:12px 0 16px}
    p{line-height:1.8;color:#d7cfe0;font-size:14px;margin:0 0 18px}
    a{display:block;margin-top:24px;padding:15px 20px;border-radius:12px;text-decoration:none;
      color:#272135;background:linear-gradient(100deg,#ffdda0,#eab5e9);font-weight:800}
    a:focus-visible{outline:3px solid white;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <span class="tag">DFCH / TREASURE</span>
    <h1>正式挑戰暫停開放</h1>
    <p>目前僅保留練習模式。世界排行榜、Google 登入與正式挑戰均已暫停，原有測試資料尚未刪除。</p>
    <p>練習開箱不需登入，抽獎與統計僅保存在此瀏覽器。</p>
    <a href="../">返回練習模式</a>
  </main>
</body>
</html>
